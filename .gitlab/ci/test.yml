# test suites, stage `test`: every suite runs in both regular and sandbox mode

# For now Gitlab CI shows Cobertura coverage report
# only after all `allow_failure: false` jobs are passed
# so do not add `allow_failure: false` to other manual jobs
# to not block the report to be shown in MR

.test:
  extends: .test_base
  stage: test
  allow_failure: false
  image: $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_TAG
  services:
    - name: bitnamilegacy/mongodb:6.0.13-debian-11-r9
      alias: mongo
  only:
    - branches
  except:
    - schedules
  needs:
    - build
  script:
    - cd $PROJECT_DIR
    - uv run pytest $TESTS_PATH -v
      --color=yes
      --cov=src/openprocurement
      --cov-config=.coveragerc
      --cov-report xml
      --dist=each
      --tx=$TX_SANDBOX
      --tx=$TX_PROD
    - sed -i -e "s|$PROJECT_DIR|$CI_PROJECT_DIR|g" coverage.xml
    - cp coverage.xml $CI_PROJECT_DIR
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  when: manual
  retry:
    max: 2
    when: runner_system_failure
  variables:
    # sys.monitoring based coverage (python 3.12+) has almost no overhead,
    # the default C tracer doubles the CPU time of the tests
    COVERAGE_CORE: sysmon
    PROJECT_DIR: /app
    # every test runs on both xdist workers: regular mode and sandbox mode, each with its own database
    TX_SANDBOX: popen//id=sand//env:DB_NAME=test_sandbox//env:SANDBOX_MODE=1//env:SINGLE_APP=1
    TX_PROD: popen//id=prod//env:DB_NAME=test//env:SANDBOX_MODE=//env:SINGLE_APP=1

.test_relocation_api:
  variables:
    TESTS_PATH: src/openprocurement/relocation/api/tests
    COV_PATH: src/openprocurement/relocation/api
    COV_FILE: .coveragerc

test_relocation_api:
  extends:
    - .test
    - .test_relocation_api


