# test suites, stages `test` (prod mode) and `test_sandbox_mode`

.test:
  extends: .test_base
  image: $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_TAG
  services:
    - name: bitnamilegacy/mongodb:6.0.13-debian-11-r9
      alias: mongo
  only:
    - branches
  except:
    - schedules
  needs:
    - build
  script:
    - cd $PROJECT_DIR
    - uv run pytest $TESTS_PATH -v
      --color=yes
      -n $XDIST_WORKERS
      --cov=src/openprocurement
      --cov-config=.coveragerc
      --cov-report xml
    - sed -i -e "s|$PROJECT_DIR|$CI_PROJECT_DIR|g" coverage.xml
    - cp coverage.xml $CI_PROJECT_DIR
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  when: manual
  retry:
    max: 2
    when: runner_system_failure
  variables:
    # sys.monitoring based coverage (python 3.12+) has almost no overhead,
    # the default C tracer doubles the CPU time of the tests
    COVERAGE_CORE: sysmon
    PROJECT_DIR: /app
    SINGLE_APP: 1
    # pytest-xdist workers per job (every worker uses its own database)
    XDIST_WORKERS: 0

# For now Gitlab CI shows Cobertura coverage report
# only after all `allow_failure: false` jobs are passed
# so do not add `allow_failure: false` to other manual jobs
# to not block the report to be shown in MR

.test_regular:
  extends: .test
  stage: test
  allow_failure: false
  variables:
    SANDBOX_MODE: ""
    DB_NAME: test

.test_sandbox_mode:
  extends: .test
  stage: test_sandbox_mode
  variables:
    SANDBOX_MODE: 1
    DB_NAME: test_sandbox

.test_relocation_api:
